# YoureEdge Backend - Development Configuration
# This file contains configuration for the development environment

[app]
environment = "development"
debug = true
log_level = "DEBUG"
port = 5000

[server]
host = "0.0.0.0"
workers = 1

[providers]
sports = "espn"
odds = "odds_api"

[cache]
dir = "./apps/backend/cache"
score_ttl = 900       # 15 minutes
odds_ttl = 300        # 5 minutes

[paths]
models_dir = "/tmp/models"
user_dir = "./apps/backend/user_data"

[gcp]
# GCP project ID must come from GOOGLE_CLOUD_PROJECT environment variable
project_id = ""
dataset_id = "sports_data"
bucket_prefix = ""
# For development: path to local credentials JSON file
# Alternative: set GOOGLE_APPLICATION_CREDENTIALS env var in secrets.env
credentials_path = ""

[odds_api]
regions = "us"
markets = "all"
format = "american"
date_format = "iso"

[features]
ml_enabled = false
alerts_enabled = true
