# YoureEdge Backend - Production Configuration
# This file contains configuration for the production environment

[app]
environment = "production"
debug = false
log_level = "INFO"
port = 5000

[server]
host = "0.0.0.0"
workers = 4

[providers]
sports = "espn"
odds = "odds_api"

[cache]
dir = "/var/cache/youredge"
score_ttl = 1800      # 30 minutes
odds_ttl = 600        # 10 minutes

[paths]
models_dir = "/opt/youredge/models"
user_dir = "/var/lib/youredge/users"

[gcp]
# GCP project ID must come from GOOGLE_CLOUD_PROJECT environment variable
project_id = ""
dataset_id = "sports_data"
bucket_prefix = "prod"
# For production: use GOOGLE_APPLICATION_CREDENTIALS env var (set in deployment)
credentials_path = ""

[odds_api]
regions = "us"
markets = "h2h,spreads,totals"
format = "american"
date_format = "iso"

[features]
ml_enabled = true
alerts_enabled = true
