# Production stack. Differs from docker-compose.yml in three ways that matter:
# the database lives elsewhere, Caddy fronts everything, and there is no `ingest`
# service because one-off jobs are run with `docker compose run`.
#
# DATABASE_URL points at managed Postgres. Nothing here starts a database, which
# is deliberate: the one part of this system that cannot be rebuilt from an API
# should not be sitting on a box you might rebuild.
services:
  engine:
    image: youredge-engine
    build: ./apps/engine
    restart: unless-stopped
    env_file: .env.prod
    expose: ["8000"]
    command: ["uvicorn", "youredge.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Exactly one of each. The Odds API budget is monthly and shared, so a second
  # poller anywhere -- including a laptop -- spends the same quota twice.
  poller:
    image: youredge-engine
    restart: unless-stopped
    env_file: .env.prod
    command: ["python", "-m", "youredge.ingest.odds_poller"]

  results:
    image: youredge-engine
    restart: unless-stopped
    env_file: .env.prod
    command: ["python", "-m", "youredge.ingest.catchup", "--loop"]

  # In-game line movement, which no provider sells back. SGO carries only open,
  # current and close per outcome, so the path between them exists only because
  # this is watching -- see the module docstring. It writes raw gzipped slates and
  # touches nothing else, which is why it is safe to run beside the poller.
  #
  # A bind mount rather than a named volume: these files are the point, and they
  # should be visible on the host to back up and to replay, not buried in Docker's
  # storage. `restart: unless-stopped` matters more here than anywhere else in this
  # file -- a capture that dies at 3pm loses the rest of the slate, permanently.
  capture:
    image: youredge-engine
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - /var/lib/youredge/sgo_raw:/var/lib/youredge/sgo_raw
    command: ["python", "-m", "youredge.ingest.sgo_capture", "--interval", "20"]

  # Runs once, copies the built frontend into a volume, exits. Caddy serves
  # that volume. A one-shot rather than a server because the frontend is static
  # once built, and running a second web server just to hand files to the first
  # one would be a process that exists to be proxied.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: youredge-web
    command: ["sh", "-c", "rm -rf /srv/* && cp -r /dist/. /srv/"]
    volumes:
      - webdist:/srv

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: .env.prod
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - webdist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      engine:
        condition: service_started
      web:
        condition: service_completed_successfully

volumes:
  webdist:
  caddy_data:
  caddy_config:
